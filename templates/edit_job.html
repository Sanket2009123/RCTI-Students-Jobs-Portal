{% extends "dashboard_base.html" %}

{% block title %}Edit Job{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/company_dashboard.css') }}">
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="dashboard-title mb-4">
        <h2><i class="fa-solid fa-pen-to-square"></i> Edit Job</h2>
        <p>Update your job details.</p>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Job Title</label>
                        <input type="text" name="title" class="form-control" value="{{ job.title }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Category</label>

                        <select name="category" class="form-select" required>

                            <option value="Software Development" {% if job.category=="Software Development" %}selected{%
                                endif %}>Software Development</option>

                            <option value="Web Development" {% if job.category=="Web Development" %}selected{% endif %}>
                                Web Development</option>

                            <option value="Mobile App Development" {% if job.category=="Mobile App Development"
                                %}selected{% endif %}>Mobile App Development</option>

                            <option value="UI/UX Design" {% if job.category=="UI/UX Design" %}selected{% endif %}>UI/UX
                                Design</option>

                            <option value="Data Science" {% if job.category=="Data Science" %}selected{% endif %}>Data
                                Science</option>

                            <option value="Artificial Intelligence" {% if job.category=="Artificial Intelligence"
                                %}selected{% endif %}>Artificial Intelligence</option>

                            <option value="Cyber Security" {% if job.category=="Cyber Security" %}selected{% endif %}>
                                Cyber Security</option>

                            <option value="Cloud Computing" {% if job.category=="Cloud Computing" %}selected{% endif %}>
                                Cloud Computing</option>

                            <option value="Networking" {% if job.category=="Networking" %}selected{% endif %}>Networking
                            </option>

                            <option value="IT Support" {% if job.category=="IT Support" %}selected{% endif %}>IT Support
                            </option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Location</label>

                        <input type="text" name="location" class="form-control" value="{{ job.location }}" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Job Type</label>

                        <select name="job_type" class="form-select" required>

                            <option value="Full Time" {% if job.job_type=="Full Time" %}selected{% endif %}>Full Time
                            </option>

                            <option value="Part Time" {% if job.job_type=="Part Time" %}selected{% endif %}>Part Time
                            </option>

                            <option value="Internship" {% if job.job_type=="Internship" %}selected{% endif %}>Internship
                            </option>

                            <option value="Remote" {% if job.job_type=="Remote" %}selected{% endif %}>Remote</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Salary</label>

                        <input type="text" name="salary" class="form-control" value="{{ job.salary }}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Experience</label>

                        <select name="experience" class="form-select">

                            <option value="Fresher" {% if job.experience=="Fresher" %}selected{% endif %}>Fresher
                            </option>

                            <option value="0-1 Year" {% if job.experience=="0-1 Year" %}selected{% endif %}>0-1 Year
                            </option>

                            <option value="1-2 Years" {% if job.experience=="1-2 Years" %}selected{% endif %}>1-2 Years
                            </option>

                            <option value="2-5 Years" {% if job.experience=="2-5 Years" %}selected{% endif %}>2-5 Years
                            </option>

                            <option value="5+ Years" {% if job.experience=="5+ Years" %}selected{% endif %}>5+ Years
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Vacancies</label>

                        <input type="number" name="vacancies" class="form-control" value="{{ job.vacancies }}" min="1">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">Application Last Date</label>

                    <input type="date" name="last_date" class="form-control" value="{{ job.last_date }}" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Required Skills</label>

                    <input type="text" name="skills" class="form-control" value="{{ job.skills }}">

                </div>

                <div class="mb-4">

                    <label class="form-label">Job Description</label>

                    <textarea name="description" rows="6" class="form-control" required>{{ job.description }}</textarea>

                </div>

                <div class="d-flex justify-content-between">

                    <a href="{{ url_for('company_jobs') }}" class="btn btn-secondary">

                        <i class="fa-solid fa-arrow-left"></i>
                        Back

                    </a>

                    <button type="submit" class="btn btn-success">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Update Job

                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
